name: Portfolio validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_lookthrough
      - name: Check dashboard server
        run: |
          python -m streamlit run dashboard.py --server.headless true --server.port 8501 &
          curl --retry 15 --retry-delay 1 --retry-connrefused --fail http://localhost:8501/_stcore/health
